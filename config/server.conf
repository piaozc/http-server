# Active runtime environment.
# Use "production" for the online stable server.
# Use "develop" for isolated development testing.
active_environment = develop

[production]
# Official online service port. Keep production on 10888.
port = 10888

# Worker threads for blocking tasks such as file IO and future Go IPC.
thread_num = 12

# Number of SubReactors. Each SubReactor owns one epoll loop thread.
sub_reactor_num = 3

# Production file storage root. Use a directory separate from develop.
storage_root = ./storage-prod

[develop]
# Development test port. Keep it different from production to avoid port conflicts.
port = 10889

# Worker threads for blocking tasks in the dev environment.
thread_num = 12

# SubReactor count for dev testing. Keep same as production unless debugging scheduling.
sub_reactor_num = 3

# Development file storage root. Safe to delete during testing.
storage_root = ./storage-dev

